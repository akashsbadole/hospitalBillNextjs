# Nginx reverse proxy for MediBill Pro production deployment
# Place this file alongside docker-compose.yml and add an nginx service

upstream app {
  server app:3000;
}

upstream realtime {
  server realtime:3001;
}

upstream video {
  server video-service:3005;
}

server {
  listen 80;
  server_name _;

  # Redirect HTTP to HTTPS (uncomment with real certs)
  # return 301 https://$host$request_uri;

  # Compression
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
  gzip_vary on;
  gzip_proxied any;
  gzip_disable "msie6";

  # Brotli (requires ngx_brotli module)
  # brotli on;
  # brotli_comp_level 6;
  # brotli_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

  client_max_body_size 50M;

  # Security headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header X-XSS-Protection "1; mode=block";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()";

  # App
  location / {
    proxy_pass http://app;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Real-time WebSocket
  location /socket.io/ {
    proxy_pass http://realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
  }

  # Video service
  location /video/ {
    proxy_pass http://video;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }

  # Static assets cache
  location /_next/static {
    proxy_pass http://app;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location /static {
    proxy_pass http://app;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }
}

