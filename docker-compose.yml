services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SOCKET_PORT=3001
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  realtime:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - NEXT_PUBLIC_SOCKET_URL=ws://realtime:3001
      - SOCKET_PORT=3001
      - DATABASE_URL=${DATABASE_URL}
    command: npx tsx server.ts
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medibill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-medibill}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medibill} -d ${POSTGRES_DB:-medibill}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  video-service:
    build:
      context: ./mini-services/video-service
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Run backup: docker compose --profile backup run --rm backup
  # Schedule via host cron: 0 3 * * * cd /app && docker compose --profile backup run --rm backup
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    env_file: .env
    environment:
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=7
    volumes:
      - ./scripts:/scripts:ro
      - postgres_backups:/backups
    entrypoint: ["sh", "/scripts/backup.sh"]
    restart: no

volumes:
  postgres_data:
  postgres_backups:
